name: Vynk Build & Deploy

# Builds the Vynk images from this repo, pushes them to GitHub Container Registry,
# then (optionally) deploys to the production server over SSH using secrets from Infisical.
#
# Deploy is OFF until you set the repository variable DEPLOY_ENABLED=true.
# See deployments/vynk/README.md for the full setup.

on:
  push:
    branches: [vynk-rebrand] # change to main once you promote the branch
  workflow_dispatch:

concurrency:
  group: vynk-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.vars.outputs.prefix }}
      tag: ${{ steps.vars.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: web, context: ".", file: apps/web/Dockerfile.web }
          - { name: admin, context: ".", file: apps/admin/Dockerfile.admin }
          - { name: space, context: ".", file: apps/space/Dockerfile.space }
          - { name: live, context: ".", file: apps/live/Dockerfile.live }
          - { name: api, context: apps/api, file: apps/api/Dockerfile.api }
          - { name: proxy, context: apps/proxy, file: apps/proxy/Dockerfile.ce }
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "prefix=ghcr.io/${owner}/vynk" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.prefix }}-${{ matrix.name }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.prefix }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy to production
    needs: build
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production # add required reviewers on this environment if you want manual approval
    steps:
      - uses: actions/checkout@v4

      - name: Create deploy folder
        run: mkdir -p deploy

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENV || 'prod' }}
          export-type: file
          file-output-path: /deploy/.env

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          test -s deploy/.env || { echo "Infisical returned no secrets"; exit 1; }
          cp deployments/vynk/docker-compose.yml deploy/docker-compose.yml
          {
            echo ""
            echo "IMAGE_PREFIX=${{ needs.build.outputs.prefix }}"
            echo "IMAGE_TAG=${{ needs.build.outputs.tag }}"
          } >> deploy/.env
          chmod 600 deploy/.env

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload and start
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH "$TARGET" "mkdir -p ~/vynk && chmod 700 ~/vynk"
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/.env "$TARGET":~/vynk/
          echo "$GHCR_TOKEN" | $SSH "$TARGET" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          $SSH "$TARGET" "cd ~/vynk && chmod 600 .env && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"

      - name: Health check
        run: |
          set -euo pipefail
          url="https://$(grep '^APP_DOMAIN=' deploy/.env | cut -d= -f2-)/api/instances/"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            [ "$code" = "200" ] && { echo "healthy: $url"; exit 0; }
            sleep 10
          done
          echo "health check failed for $url (last status: $code)"; exit 1
