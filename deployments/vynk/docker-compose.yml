# Vynk production stack.
# - Database: external (Supabase Postgres) via DATABASE_URL
# - File storage: AWS S3 (USE_MINIO=0)
# - Redis + RabbitMQ run here in Docker
# Secrets come from Infisical (written to .env by the deploy workflow). Never hardcode them here.

x-redis-env: &redis-env
  # Uses the existing Redis container on shared_net. DB 5 keeps Vynk data separate from other apps.
  # If your Redis needs a password, set REDIS_URL in Infisical, e.g. redis://:PASSWORD@redis:6379/5
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/5}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
  USE_MINIO: 0

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ${CERT_EMAIL}
  CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
  CERT_ACME_DNS: ${CERT_ACME_DNS:-}
  LISTEN_HTTP_PORT: 80
  LISTEN_HTTPS_PORT: 443
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
  SITE_ADDRESS: ${SITE_ADDRESS:-${APP_DOMAIN}}

x-mq-env: &mq-env
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vynk}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-vynk}

x-live-env: &live-env
  API_BASE_URL: http://api:8000
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

x-app-env: &app-env
  WEB_URL: ${WEB_URL}
  APP_BASE_URL: ${WEB_URL}
  ADMIN_BASE_URL: ${WEB_URL}
  ADMIN_BASE_PATH: /god-mode
  SPACE_BASE_URL: ${WEB_URL}
  SPACE_BASE_PATH: /spaces
  LIVE_BASE_URL: ${WEB_URL}
  LIVE_BASE_PATH: /live
  DEBUG: 0
  CORS_ALLOWED_ORIGINS: ${WEB_URL}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  DATABASE_URL: ${DATABASE_URL}
  SECRET_KEY: ${SECRET_KEY}
  AMQP_URL: amqp://${RABBITMQ_USER:-vynk}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST:-vynk}
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-vynk}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-vynk}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  # Optional: email defaults (can also be set in the admin UI)
  EMAIL_FROM: ${EMAIL_FROM:-Vynk <no-reply@robustcraft.com>}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  # Optional: AI (openai | anthropic | gemini)
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  # Telemetry stays off unless OTLP_ENDPOINT is set

x-backend: &backend
  image: ${IMAGE_PREFIX}-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  environment:
    <<: [*app-env, *redis-env, *aws-s3-env, *proxy-env]

services:
  web:
    image: ${IMAGE_PREFIX}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    networks:
      default:
      shared_net:
        aliases: [vynk-web]

  space:
    image: ${IMAGE_PREFIX}-space:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    networks:
      default:
      shared_net:
        aliases: [vynk-space]

  admin:
    image: ${IMAGE_PREFIX}-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    networks:
      default:
      shared_net:
        aliases: [vynk-admin]

  live:
    image: ${IMAGE_PREFIX}-live:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: [*live-env, *redis-env]
    depends_on: [api]
    networks:
      default:
      shared_net:
        aliases: [vynk-live]

  migrator:
    <<: *backend
    command: ./bin/docker-entrypoint-migrator.sh
    restart: "no"
    volumes:
      - logs_migrator:/code/plane/logs
    depends_on: [plane-mq]
    networks: [default, shared_net]

  api:
    <<: *backend
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    depends_on:
      migrator:
        condition: service_completed_successfully
      plane-mq:
        condition: service_started
    networks:
      default:
      shared_net:
        aliases: [vynk-api]

  worker:
    <<: *backend
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    depends_on: [api]
    networks: [default, shared_net]

  beat-worker:
    <<: *backend
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat-worker:/code/plane/logs
    depends_on: [api]
    networks: [default, shared_net]


  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


volumes:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:

networks:
  shared_net:
    external: true
