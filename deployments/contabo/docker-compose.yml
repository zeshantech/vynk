# Vynk production stack for a single Contabo VPS (self-contained).
#
# - Postgres, Valkey (Redis), RabbitMQ and the Caddy proxy (automatic HTTPS) run here in Docker
# - File storage: AWS S3 (USE_MINIO=0). There is no MinIO container and no S3 endpoint override
# - App images come from GHCR (built by .github/workflows/vynk-deploy.yml)
# - Only the proxy publishes ports (80/443). Everything else is on the private compose network
# Every value comes from Infisical (written to .env by the deploy workflow). Never hardcode secrets here.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/0

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:?set AWS_REGION in Infisical}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in Infisical}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in Infisical}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:?set AWS_S3_BUCKET_NAME in Infisical}
  USE_MINIO: 0

x-mq-env: &mq-env
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vynk}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in Infisical}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-vynk}

x-live-env: &live-env
  API_BASE_URL: http://api:8000
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?set LIVE_SERVER_SECRET_KEY in Infisical}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:?set WEB_URL in Infisical}
  APP_BASE_URL: ${WEB_URL}
  ADMIN_BASE_URL: ${WEB_URL}
  ADMIN_BASE_PATH: /god-mode
  SPACE_BASE_URL: ${WEB_URL}
  SPACE_BASE_PATH: /spaces
  LIVE_BASE_URL: ${WEB_URL}
  LIVE_BASE_PATH: /live
  DEBUG: 0
  CORS_ALLOWED_ORIGINS: ${WEB_URL}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  DATABASE_URL: postgresql://${POSTGRES_USER:-vynk}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Infisical}@plane-db:5432/${POSTGRES_DB:-vynk}
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in Infisical}
  AMQP_URL: amqp://${RABBITMQ_USER:-vynk}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST:-vynk}
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-vynk}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-vynk}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  # Optional: email defaults (can also be set in the admin UI)
  EMAIL_FROM: ${EMAIL_FROM:-Vynk <no-reply@robustcraft.com>}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  # Optional: AI (openai | anthropic | gemini)
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  # Telemetry stays off unless OTLP_ENDPOINT is set

x-backend: &backend
  image: ${IMAGE_PREFIX:?}-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  logging: *logging
  environment:
    <<: [*app-env, *redis-env, *aws-s3-env]

services:
  proxy:
    image: ${IMAGE_PREFIX:?}-proxy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${APP_DOMAIN:?set APP_DOMAIN in Infisical}
      # The proxy's Caddyfile renders this line verbatim into its global options block
      CERT_EMAIL: email ${ACME_EMAIL:?set ACME_EMAIL in Infisical}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CERT_ACME_DNS: ${CERT_ACME_DNS:-}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      # Directly exposed to the internet: do not trust client-supplied X-Forwarded-For.
      # If you put Cloudflare (or another proxy) in front, set TRUSTED_PROXIES to its ranges.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, space, admin, live]

  web:
    image: ${IMAGE_PREFIX}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on: [api]

  space:
    image: ${IMAGE_PREFIX}-space:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on: [api]

  admin:
    image: ${IMAGE_PREFIX}-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on: [api]

  live:
    image: ${IMAGE_PREFIX}-live:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      <<: [*live-env, *redis-env]
    depends_on: [api]

  migrator:
    <<: *backend
    command: ./bin/docker-entrypoint-migrator.sh
    restart: "no"
    volumes:
      - logs_migrator:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy

  api:
    <<: *backend
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/instances/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      migrator:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    depends_on: [api]

  beat-worker:
    <<: *backend
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat-worker:/code/plane/logs
    depends_on: [api]

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    logging: *logging
    command: postgres -c max_connections=${PG_MAX_CONNECTIONS:-200}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vynk}
      POSTGRES_DB: ${POSTGRES_DB:-vynk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    logging: *logging
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  pgdata:
  redisdata:
  rabbitmq_data:
  caddy_data:
  caddy_config:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
